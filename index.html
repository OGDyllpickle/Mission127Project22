<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Online</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #2563eb 0%, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
                #080b14;
            color: white;
            overflow: hidden;
        }

        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: #2563eb;
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.18;
        }

        .card {
            position: relative;
            width: 90%;
            max-width: 650px;
            padding: 55px 45px;
            text-align: center;

            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(37, 99, 235, 0.12);
        }

        .icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.35);

            font-size: 42px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;

            background: linear-gradient(90deg, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 18px;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 12px 20px;

            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 50px;

            color: #86efac;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;

            box-shadow: 0 0 10px #22c55e;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .message {
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            color: #d1d5db;
            line-height: 1.7;
        }

        .message strong {
            color: white;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>

    <div class="card">

        <div class="icon">
            ?
        </div>

        <h1>Welcome!</h1>

        <p class="subtitle">
            Your website has successfully connected and is being served correctly.
        </p>

        <div class="status">
            <span class="dot"></span>
            Server Online
        </div>

        <div class="message">
            <strong>If you can see this page, you're good to go!</strong>
            <br><br>
            Your web server is running and your HTML files are being loaded successfully.
        </div>

        <footer>
            System Status • Everything Operational
        </footer>

    </div>

</body>
</html>
